<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f5" />
    <link rel="icon" href="./icon.svg" />
    <title>TAP to TALK</title>
  </head>
  <body>
    <main id="app">
      <section class="screen splash-screen" id="screen-splash" aria-label="TAP to TALK">
        <img class="splash-cover" src="./assets/brand/splash.webp" alt="TAP to TALK" />
      </section>
      <section class="screen title-screen hidden" id="screen-title">
        <header class="brand-block"><img class="brand-mark" src="./assets/brand/logo.svg" alt="TAP to TALK" /></header>
        <nav class="mode-list" aria-label="게임 모드">
          <button class="mode-btn" id="mode-sentence"><span class="mode-name">문장 따라쓰기</span><span class="mode-desc">주어진 문장을 가장 빠르게 완성하세요</span></button>
          <button class="mode-btn" id="mode-free"><span class="mode-name">주제 글쓰기</span><span class="mode-desc">제시어를 넣어 60초 동안 긴 문장을 만드세요</span></button>
        </nav>
        <p class="prototype-note">게임 규칙과 레이아웃을 만드는 중인 프로토타입입니다.</p>
      </section>
      <section class="screen talk-screen hidden" id="screen-game">
        <header class="hud">
          <button class="icon-btn" id="btn-back" aria-label="메뉴로 돌아가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
          </button>
          <div class="run-heading"><span id="run-mode">문장 따라쓰기</span><strong id="run-clock">00:00.0</strong></div>
          <span class="icon-spacer" aria-hidden="true"></span>
        </header>
        <section class="writing-card" aria-live="polite">
          <div class="target-prompt">
            <p class="target-label" id="target-label">목표 문장</p><p class="target-text" id="target-text"></p>
          </div>
          <p class="typed-text" id="typed-text" data-empty="아래 자모를 눌러 입력하세요"></p>
          <div class="writing-submit-row hidden" id="writing-submit-row">
            <p class="writing-feedback" id="writing-feedback"></p>
          </div>
        </section>
        <div class="letter-board" id="letter-board" aria-label="천지인 자모판"></div>
        <footer class="fixed-controls" aria-label="고정 입력 키">
          <button class="control-btn" id="btn-backspace" aria-label="한 입력 지우기">⌫</button>
          <button class="control-btn" id="btn-space">띄어쓰기</button>
          <button class="control-btn vowel-control" id="btn-dot" aria-label="천지인 점">·</button>
          <button class="control-btn stroke-control" id="btn-stroke">획추가</button>
          <button class="control-btn punctuation" data-value=".">.</button><button class="control-btn punctuation" data-value=",">,</button>
          <button class="control-btn punctuation" data-value="!">!</button><button class="control-btn punctuation" data-value="?">?</button>
        </footer>
        <button class="submit-btn hidden" id="btn-submit">제출하기</button>
      </section>
      <div class="result-layer hidden" id="result-layer" role="dialog" aria-modal="true">
        <div class="result-panel"><p class="result-kicker">FINISH</p><h2 id="result-title">완성!</h2><p id="result-detail"></p>
          <button class="wood-btn" id="btn-again">다시 하기</button><button class="text-btn" id="btn-result-menu">메뉴</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
